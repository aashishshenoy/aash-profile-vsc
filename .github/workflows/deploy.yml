name: Deploy React Application to EC2 (Keys for Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The runner needs to read code and write (push) to the registry
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ secrets.ECR_REPO_URL }}
  EC2_HOST: ${{ secrets.EC2_DEPLOY_HOST }}
  EC2_USER: ec2-user
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- ECR Authentication (Uses static Access Keys) ---
      # This loads the credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) from secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      # --- Docker Build and Push ---
      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }} 
        run: |
          FULL_IMAGE_NAME=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          
          echo "Building and tagging image: ${FULL_IMAGE_NAME}:${{ env.IMAGE_TAG }}"
          docker build -t ${FULL_IMAGE_NAME}:${{ env.IMAGE_TAG }} .
          docker tag ${FULL_IMAGE_NAME}:${{ env.IMAGE_TAG }} ${FULL_IMAGE_NAME}:latest
          
          echo "Pushing image to ECR..."
          docker push ${FULL_IMAGE_NAME}:${{ env.IMAGE_TAG }}
          docker push ${FULL_IMAGE_NAME}:latest

      # --- Deployment via SSH (Relies on EC2 Instance Profile for ECR Pull) ---
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          # Uses the SSH private key secret
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          script: |
            echo "Deployment started on EC2 instance."
            
            # 1. Define variables for clarity and safety
            ECR_REGISTRY_URI="${{ steps.login-ecr.outputs.registry }}"
            FULL_IMAGE_PULL_NAME="${ECR_REGISTRY_URI}/${{ env.ECR_REPOSITORY }}:latest"
            AWS_REGION="${{ env.AWS_REGION }}"

            # 2. Get the ECR login password using the EC2's IAM Role
            # The output of this command is the short-lived password.
            ECR_PASSWORD=$(/usr/bin/aws ecr get-login-password --region $AWS_REGION)

            # 3. Perform the Docker Login securely, piping the password
            # CRITICAL FIX: The registry URI is passed as the single final argument.
            echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin $ECR_REGISTRY_URI
            
            # --- Continue with Pull and Run ---
            
            echo "Pulling latest image: $FULL_IMAGE_PULL_NAME"
            sudo docker pull $FULL_IMAGE_PULL_NAME
            
            # Stop and remove the existing container if it's running
            if sudo docker ps -q --filter "name=aashish_profile"; then
              echo "Stopping existing container..."
              sudo docker stop aashish_profile
              sudo docker rm aashish_profile
            fi
            
            # Run the new container, exposing port 3000 (proxied by Nginx)
            echo "Starting new container..."
            sudo docker run -d \
              --name aashish_profile \
              -p 3000:80 \
              $FULL_IMAGE_PULL_NAME
            
            echo "Deployment finished."